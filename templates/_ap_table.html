<div class="table-wrap"><table><thead><tr><th>SSID</th><th>BSSID</th><th>Channel</th><th>Signal</th><th>Encryption</th><th>Risk</th></tr></thead><tbody>{% for ap in aps %}<tr><td>{{ap.ssid or '(hidden)'}}</td><td>{{ap.bssid}}</td><td>{{ap.channel}}</td><td>{{ap.signal if ap.signal is not none else '—'}}</td><td>{{ap.encryption}}</td><td><span class="risk {{ap.risk|lower}}">{{ap.risk}}</span></td></tr>{% else %}<tr><td colspan="6">No access points found.</td></tr>{% endfor %}</tbody></table></div>
